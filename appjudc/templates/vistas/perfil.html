{% extends 'baseusuario.html' %}
{%load static%}
{% block titulo %}Perfil - Usuario{% endblock %}

{% block contenido %}
<div class="col-md-9 content-area p-3">
    <div class="text-center">
        <h1>Perfil de usuario</h1>
    </div>
    <div class="container p-3 ">
        <div class="card shadow">
            <div class="card-body">
                {% csrf_token %}
                <form action="#" method="post">

                    <div class="row">
                        <div class="col-md-6 p-2">
                            <label for="carnet" class="form-label">Número de carnet:</label>
                            <input type="text" class="form-control" id="carnet" name="carnet" disabled required>
                        </div>
                        <div class="col-md-6 p-2">
                            <label for="nombre" class="form-label">Nombre</label>
                            <input type="text" class="form-control mi-input" id="nombre" name="nombre"
                                placeholder="Nombres" required pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ\s\-]+"
                                title="Solo letras, espacios y guiones"
                                oninput="this.value = this.value.replace(/[^A-Za-zÁÉÍÓÚáéíóúÑñ \-]/g,'');">


                            <!-- <label for="nombre" class="form-label">Nombres:</label>
                            <input type="text" class="form-control mi-input" id="nombre" name="nombre"
                                pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ\s\-]+" title="Solo letras, espacios y guiones"
                                oninput="this.value = this.value.replace(/[^A-Za-zÁÉÍÓÚáéíóúÑñ \-]/g,'');" autofocus
                                required> -->

                        </div>
                        <div class="col-md-6 p-2">
                            <label for="apellido" class="form-label">Apellidos:</label>
                            <input type="text" class="form-control mi-input" id="apellido" name="apellido" required>
                        </div>
                        <div class="col-md-6 p-2">
                            <label for="email" class="form-label">Correo electrónico:</label>
                            <input type="email" class="form-control mi-input" id="email" name="email" required>
                        </div>
                        <div class="col-md-4 p-2">
                            <label for="tel" class="form-label">Telefono:</label>
                            <input type="text" class="form-control" id="tel" name="tel" required>
                        </div>
                        <div class="col-md-4 p-2">
                            <label for="password" class="form-label">Password:</label>
                            <input type="password" class="form-control mi-input" id="password" name="password" required>
                        </div>
                        <div class="col-md-4 p-2">
                            <label for="passwordc" class="form-label">Confirmar Password:</label>
                            <input type="password" class="form-control mi-input" id="passwordc" name="passwordc" required>
                        </div>
                        <div class=" col-md-12 p-2">
                            <label for="Textarea">Dirección:</label>
                            <textarea class="form-control mi-input" name="direccion" id="direccion" required
                                style="height: 70px"></textarea>
                        </div>
                        <div class="d-flex justify-content-center p-3">
                            <button type="submit" class="btn btn-outline-primary">Actualizar</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
